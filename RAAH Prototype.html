        function animateCounters() {
            DUMMY_DATA.kpis.forEach(kpi => {
                const el = document.getElementById(`kpi-${kpi.id}`);
                if(!el) return;
                const target = kpi.value;
                let current = 0;
                const inc = target / 40; 
                const timer = setInterval(() => {
                    current += inc;
                    if (current >= target) { current = target; clearInterval(timer); }
                    el.innerText = Math.floor(current).toLocaleString();
                }, 20);
            });
        }

        function renderRadarChart(size=200, data) {
            const center = size/2;
            const radius = size * 0.4;
            const angles = data.map((_, i) => (Math.PI * 2 * i) / data.length - Math.PI / 2);
            const axes = angles.map((angle, i) => {
                const x = center + radius * Math.cos(angle);
                const y = center + radius * Math.sin(angle);
                const lx = center + (radius + 15) * Math.cos(angle);
                const ly = center + (radius + 15) * Math.sin(angle);
                return `<line x1="${center}" y1="${center}" x2="${x}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#64748b" font-weight="bold">${data[i].label}</text>`;
            }).join('');
            const points = data.map((d, i) => {
                const r = (d.value / 100) * radius;
                return `${center + r * Math.cos(angles[i])},${center + r * Math.sin(angles[i])}`;
            }).join(' ');
            return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="mx-auto"><circle cx="${center}" cy="${center}" r="${radius}" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="${center}" cy="${center}" r="${radius * 0.66}" fill="none" stroke="#e2e8f0"/><circle cx="${center}" cy="${center}" r="${radius * 0.33}" fill="none" stroke="#e2e8f0"/>${axes}<polygon points="${points}" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="2"/>${data.map((d, i) => { const r = (d.value / 100) * radius; const cx = center + r * Math.cos(angles[i]); const cy = center + r * Math.sin(angles[i]); return `<circle cx="${cx}" cy="${cy}" r="3" fill="#ef4444"/>`; }).join('')}</svg>`;
        }

            <svg width="120" height="70" viewBox="0 0 100 60" class="mx-auto overflow-visible">
                <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

                      stroke-dasharray="${circumference}" stroke-dashoffset="${circumference - progress}" class="transition-all duration-1000 ease-out" filter="url(#glow)"/>

        function renderDonutChart(height=160, data) {
            let svg = `<svg viewBox="0 0 200 ${height}" class="w-full h-full"><g transform="translate(100,${height/2})">`;
            let cumulativePercent = 0;
            data.forEach(slice => {
                const [startX, startY] = getCoordinatesForPercent(cumulativePercent);
                cumulativePercent += slice.pct / 100;
                const [endX, endY] = getCoordinatesForPercent(cumulativePercent);
                const largeArcFlag = slice.pct > 50 ? 1 : 0;
                const pathData = [`M ${startX * 70} ${startY * 70}`, `A 70 70 0 ${largeArcFlag} 1 ${endX * 70} ${endY * 70}`, `L ${endX * 40} ${endY * 40}`, `A 40 40 0 ${largeArcFlag} 0 ${startX * 40} ${startY * 40}`].join(' ');
                svg += `<path d="${pathData} Z" fill="${slice.color}" stroke="white" stroke-width="2"/>`;
            });
            svg += `</g><text x="100" y="${height/2 + 5}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0A1C40">Mix</text></svg>`;
            return svg;
        }

        function getCoordinatesForPercent(percent) {
            const x = Math.cos(2 * Math.PI * percent);
            const y = Math.sin(2 * Math.PI * percent);
            return [x, y];
        }
